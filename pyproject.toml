[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift"
version = "0.1.0"
description = "Criteo uplift experiment: validity, ATE, CUPAC, T-learner, and policy economics"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
